<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon — get notified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f; --surface: #1b232c; --line: #2c3742;
    --text: #edeee7; --muted: #8b95a1;
    --amber: #e8a33d; --amber-dim: #6b5127; --teal: #4fa893; --red: #d9695f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 28px; }
  header { border-bottom: 1px solid var(--line); padding: 24px 0; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 18px 'Archivo', sans-serif; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px var(--amber-dim); }
  .pill { font: 12px 'Space Mono', monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; }
  .pill.on { color: var(--teal); border-color: var(--teal); }
  .pill.err { color: var(--red); border-color: var(--red); }
  .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; padding: 88px 0; }
  h1 { font: 800 54px/1.05 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0; max-width: 12ch; }
  .lede { color: var(--muted); font-size: 18px; max-width: 46ch; margin: 22px 0 34px; }
  button { font: 600 15px 'Inter', sans-serif; background: var(--amber); color: #1a1305; border: 0; border-radius: 3px; padding: 13px 22px; cursor: pointer; }
  button:hover { background: #f0ad4d; }
  button:disabled { background: #232c36; color: var(--muted); cursor: default; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .note { display: inline-block; margin-left: 14px; font-size: 13px; color: var(--muted); }
  svg { width: 100%; max-width: 380px; margin: 0 auto; display: block; }
  .ping { animation: ping 2.6s cubic-bezier(.2,.7,.4,1) infinite; }
  .ping.b { animation-delay: .8s; } .ping.c { animation-delay: 1.6s; }
  @keyframes ping { from { r: 20; opacity: .7; } to { r: 160; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ping { animation: none; opacity: .15; } }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding: 48px 0; } h1 { font-size: 38px; }
    svg { order: -1; max-width: 240px; } .note { display: block; margin: 12px 0 0; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span class="dot"></span> Beacon</div>
  <div class="pill" id="pill">checking…</div>
</div></header>

<main class="wrap hero">
  <div>
    <h1>Get word the moment it goes out.</h1>
    <p class="lede">Turn on notifications once. Whatever gets sent reaches you directly, even when this tab is closed.</p>
    <button id="btn">Turn on notifications</button>
    <span class="note" id="note">Works in Chrome, Edge, Firefox and Android. On iPhone, add this site to your Home Screen first.</span>
  </div>
  <svg viewBox="0 0 400 400" aria-hidden="true">
    <circle class="ping" cx="200" cy="200" r="20" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <circle class="ping b" cx="200" cy="200" r="20" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <circle class="ping c" cx="200" cy="200" r="20" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="46" fill="#1b232c" stroke="#2c3742"/>
    <circle cx="200" cy="200" r="10" fill="#e8a33d"/>
  </svg>
</main>

<footer class="wrap" style="padding:0 28px 32px;font-size:13px;"><a href="admin.html" style="color:var(--muted)">Admin</a></footer>

<script>
  // ── Fill these two in (see README) ──────────────────────────────
  const PUSH_SERVER_URL = "https://YOUR-MACHINE.your-tailnet.ts.net";
  const VAPID_PUBLIC_KEY = "PASTE_PUBLIC_KEY_FROM_setup_keys.py";
  // ────────────────────────────────────────────────────────────────

  const pill = document.getElementById('pill');
  const btn = document.getElementById('btn');
  const note = document.getElementById('note');

  function setState(text, cls, disable) {
    pill.textContent = text; pill.className = 'pill ' + (cls || '');
    btn.disabled = !!disable;
  }

  function b64ToBytes(s) {
    const pad = '='.repeat((4 - s.length % 4) % 4);
    const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  async function init() {
    if (VAPID_PUBLIC_KEY.startsWith('PASTE_')) { setState('not configured', 'err', true); note.textContent = 'Set VAPID_PUBLIC_KEY and PUSH_SERVER_URL in index.html.'; return; }
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { setState('not supported', 'err', true); note.textContent = 'This browser does not support push notifications.'; return; }
    const reg = await navigator.serviceWorker.register('sw.js');
    const existing = await reg.pushManager.getSubscription();
    if (existing) { setState('notifications on', 'on', true); btn.textContent = 'Notifications on'; note.textContent = "You're all set."; }
    else setState('notifications off');
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Requesting…';
    try {
      if (await Notification.requestPermission() !== 'granted') throw new Error('Permission was not granted. Check your browser settings.');
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY) });
      const res = await fetch(PUSH_SERVER_URL + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
      if (!res.ok) { await sub.unsubscribe(); throw new Error('Could not reach the server (' + res.status + ').'); }
      setState('notifications on', 'on', true); btn.textContent = 'Notifications on'; note.textContent = "You're all set.";
    } catch (e) {
      note.textContent = e.message || 'Something went wrong.';
      btn.disabled = false; btn.textContent = 'Turn on notifications';
    }
  });

  init();
</script>
</body>
</html>
